<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/abtalquest-emblem.png" />
    <link rel="apple-touch-icon" href="/abtalquest-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#016ba5" />
    <meta name="description" content="AbtalQuest - A safe, values-based digital universe for children with no ads and no violence. Discover quests, earn badges, and grow with values." />
    
    <!-- Google Fonts: Montserrat (Headlines/Buttons), Roboto Mono (Body/UI), Baloo 2 (Gamified Badges/Rewards), Cairo & Tajawal (Arabic RTL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

    <title>AbtalQuest | Safe, Values-Based Digital Universe for Children</title>

    <!-- Zero-flash theme and language initialization -->
    <script>
      (function() {
        try {
          // Theme initialization
          var savedTheme = localStorage.getItem('abtalquest_theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          // Language & RTL initialization
          var savedLang = localStorage.getItem('abtalquest_lang') || 'en';
          document.documentElement.lang = savedLang;
          document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#071727] text-brand-text-primary dark:text-slate-100 font-body antialiased selection:bg-brand-secondary/20 selection:text-brand-secondary transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
